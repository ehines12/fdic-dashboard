name: Refresh FDIC data and deploy dashboard

# Weekly: Mondays ~8:17 AM Central during CDT (7:17 AM during CST). Cron is UTC.
# FDIC data change quarterly (QBP ~8 weeks after quarter-end), so weekly picks up new quarters
# within a few days of release. Manual runs: Actions tab -> Run workflow.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # weekly heartbeat commit (keeps the schedule from auto-disabling after 60 days)
  pages: write
  id-token: write

concurrency:
  group: refresh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Latest data from previous runs (falls back to the seed copy committed in the repo)
      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: web/data
          key: fdic-data-${{ github.run_id }}
          restore-keys: fdic-data-

      - name: Fetch FDIC data (BankFind Suite API)
        run: |
          set -o pipefail
          python fetch_data.py 2>&1 | tee fetch.log

      - name: Per-group fetch summary
        if: always()
        run: python ci_summary.py

      - name: Build self-contained snapshot
        run: |
          mkdir -p _site
          python export_html.py --no-fetch --out _site/index.html
          cp web/data/data.json _site/data.json
          touch _site/.nojekyll
          ls -la _site
          grep -o '<title>[^<]*</title>' _site/index.html

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: web/data
          key: fdic-data-${{ github.run_id }}

      - name: Commit heartbeat
        continue-on-error: true   # never block the deploy
        run: |
          date -u +%G-W%V > state/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/heartbeat.txt
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "heartbeat ($(date -u +%Y-%m-%dT%H:%MZ))"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "::warning::could not push heartbeat commit"; exit 1; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
